<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>

    <style>
      model-viewer {
        width: 100%;
        height: 500px;
        background-color: #f5f5f5;
      }
    </style>
  </head>

  <body>
    <model-viewer
      src="./GLTF/flama.gltf"
      alt="Interactive 3D object"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
    >
    </model-viewer>
  </body>
</html>
